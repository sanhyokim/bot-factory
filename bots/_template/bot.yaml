# 売買ルールの数字(SPEC 4.2)。実装工程が売買ルールから書き直す。この項目以外は増やさない
type: 値動き             # 値動き / 歪み
symbol: BTC              # 銘柄は1つ
timeframe: 15m           # 判断に使うローソク足(1m 5m 15m 1h 4h 1d など。歪み型は 1h)
stop_loss_pct: 0.6       # −0.6% で損切り(両型で必須)
max_hold_hours: 12       # 最長保有の時間。持ったら次の足の始値で必ず出る(両型で必須)
max_trades_per_day: 6    # 1日(日本時間)の最大取引回数
take_profit_pct: 1.0     # 値動き型だけ: +1.0% で利益確定
# funding_x: 0.01        # 歪み型だけ: 1時間あたりの資金調達料が ±x% を越えたら受け取る側で入る
# funding_y: 0.003       # 歪み型だけ: ±y% の内側に戻ったら出る(0 ≦ y < x)
leverage: 1              # 固定。変えると土台が読み込まない
max_positions: 1         # 固定。変えると土台が読み込まない
# 1回の上限額は呼び出し側(paper評価は200ドル)が決める。ここには書かない
