# 売買ルールの数字(SPEC 4.2)。この項目以外は増やさない
symbol: BTC              # 銘柄は1つ
timeframe: 15m           # 判断に使うローソク足(1m 5m 15m 1h 4h 1d など)
take_profit_pct: 1.0     # +1.0% で利益確定
stop_loss_pct: 0.6       # −0.6% で損切り
max_trades_per_day: 6    # 1日(日本時間)の最大取引回数
# max_hold_bars: 48      # 任意。この本数持ったら次の足で手仕舞い
# 1回の上限額・同時に持てる数(1)・レバレッジ(1倍)は土台が決める。ここには書かない
