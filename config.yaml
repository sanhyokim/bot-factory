# bot-factory 設定(SPEC 3.1 / 7章)
db_path: data/factory.db
bots_dir: bots              # 実装工程が作るBOTの置き場(bots/B-0001/ など)

ai:
  # 接続先: api / claude_code / mock(mock はテスト・試し用。AIを呼ばず費用0で記録)
  backend: api
  # 工程ごとのモデル(SPEC 7.1)。実装・修理を Opus に上げる時はここを1行変える
  stages:
    explore: haiku
    investigate: haiku
    design: sonnet
    implement: sonnet
    repair: sonnet
    refute: sonnet
    manual: haiku          # 手動の動作確認用(python -m factory ask)
  models:
    haiku: claude-haiku-5-5
    sonnet: claude-sonnet-5-5
    opus: claude-opus-5-5
  # 1Mトークンあたりのドル単価(2026-10時点の公表値。変わったらここを直す)
  prices:
    haiku:  {input: 0.10, output: 0.50}
    sonnet: {input: 2.00, output: 10.00}
    opus:   {input: 4.00, output: 20.00}
  batch_discount: 0.5       # 一括処理は半額(SPEC 7.2)
  daily_cost_limit_usd: 3.0 # 1日の上限(SPEC 7.3)
  max_tokens: 4000
  effort: low               # 考える深さ。安く済ませるため low
  credit_usd: 100           # 付与されたクレジット(画面の「残高の見込み」に使う。SPEC 7.2)

memo:
  match_days: 90            # 登録前照合の対象期間(SPEC 6.3)
  match_tags: [手数料負け, 機会不足, 利益不足, 損益比不足]

dashboard:
  port: 8800
  refresh_seconds: 30

hyperliquid:
  info_url: https://api.hyperliquid.xyz/info
  leaderboard_url: https://stats-data.hyperliquid.xyz/Mainnet/leaderboard
  taker_fee_rate: 0.00045   # 成行の手数料率(最も下の段階。取引量が増えると下がる)
  min_order_usd: 10         # 取引所の最小注文額
  slippage_pct: 0.05        # 想定の滑り(往復で、%)。調査の計算とpaper評価の約定の値段の両方に使う
  timeout_seconds: 30
  weight_per_minute: 1000   # 読み取りの重さの上限/分(取引所の上限1200より少し低く)

explore:                    # SPEC 5.1
  top_wallets: 300          # 1日に調べる財布の数の上限(候補を30日の損益の順に。7日以内に調べた財布は飛ばして次へ)
  candidate_account_usd: [100, 100000]  # 順位表の候補: 資金の範囲(ドル)。真似できる大きさで取引する財布に先に絞る。
                                         # 上限1万ドルでは候補が520件ほどしかなく、7日の再分析待ちで1日50件ほどしか調べられなかった(10/28)
  candidate_volume_usd: [10000, 3000000]  # 順位表の候補: 30日の取引量の範囲(ドル)。下限は50回 × 往復 × 100ドル、
                                         # 上限は取引額2000ドルで750回の往復分(これより大きいのは大口か高頻度の取引)
  days: 30
  min_trades: 50            # 30日の取引回数(入って出るまでを1回)
  max_drawdown_pct: 20      # 最大の落ち込み(確定した損益で計算)
  max_median_notional_usd: 2000
  max_wallets: 30           # AIに渡す財布の数/日
  trades_for_ai: 100        # AIに渡す直近の取引の数
  hypotheses_per_wallet: 3
  rescan_days: 7            # 同じ財布を再分析しない日数
  max_fill_pages: 3         # 1財布で読む約定は6000件まで。超える財布は高頻度の取引とみなし対象外
  daily_input_chars: 5000000  # Haikuに渡す文字数の上限/日
  batch_wait_minutes: 30    # 一括処理の答えを待つ時間。間に合わなければ次の実行で受け取る

explore_funding:            # SPEC 5.1 入口2(資金調達料の歪み)。AIは使わない
  hours: 24                 # 直近何時間の資金調達料を見るか
  min_abs_rate_pct: 0.01    # 1時間あたりの資金調達料の絶対値がこれ(%)を超えた時間を数える(年率で約88%)
  min_hours: 3              # 超えた時間がこれ以上ある銘柄だけ
  min_day_volume_usd: 1000000   # 直近24時間の出来高の下限(薄い銘柄は滑りが大きい)
  reregister_days: 3        # 同じ銘柄は3日間は再登録しない

investigate:                # SPEC 5.2
  fee_multiple: 3           # 値動き型: 値幅が(往復の手数料+滑り)のこの倍未満なら見送り
  min_occurrences: 10       # 値動き型: 30日で入る場面がこの回数未満なら見送り
  funding_min_hours: 30     # 歪み型: 30日で資金調達料が x% を超えた時間がこれ未満なら見送り
  funding_fee_multiple: 2   # 歪み型: 受け取れた資金調達料の合計が、往復の手数料+滑りの合計のこの倍未満なら見送り
  days: 30
  max_holds: 3              # データが取れずに保留した回数がこれに達したら未対応
  max_per_day: 90

tuning:                     # 週1回の棚卸しで、型ごとの最多の札に応じて1段きつくする(SPEC 6.3 用途3)
  値動き:
    手数料負け: {setting: fee_multiple, value: 4}
    機会不足: {setting: min_occurrences, value: 15}
  歪み:
    機会不足: {setting: min_hours, value: 6}               # 入口2の「3時間以上」を「6時間以上」に
    手数料負け: {setting: funding_fee_multiple, value: 3}  # 調査の「2倍未満」を「3倍未満」に

design:                     # SPEC 5.3
  max_per_day: 10

implement:                  # SPEC 5.4・5.7
  max_per_day: 5
  max_repairs: 3            # 修理は通算3回まで
  test_days: 30

paper:                      # SPEC 5.5
  amount_usd: 200
  warmup_bars: 300          # 始める前の足を判断の材料として何本見せるか
  min_days: 14
  min_trades: 30
  max_losing_streak: 8      # これに達したら不合格(合格は8回未満)
  max_drawdown_usd: 40
  no_signal_hours: 72
  pass_avg_net_usd: 1.0
  pass_profit_factor: 1.5

refute:                     # SPEC 5.6
  fee_multiplier: 2         # 手数料と滑りをこの倍にして計算し直す
  max_single_share: 0.5

feed:                       # 価格の受け取り口(SPEC 3.1)。python -m factory feed
  interval_minutes: 10      # 動いているBOTの銘柄の価格と資金調達料を、この間隔で帳簿に取り込む

watchdog:                   # 見張り役(SPEC 3.3)。python -m factory watchdog
  check_seconds: 60         # 生死とメモリを確認する間隔
  memory_limit_mb: 1024     # 1プロセスのメモリの上限。超えたらそのプロセスだけ再起動
  max_crashes_per_hour: 3   # 1時間にこの回数落ちたら再起動をやめ、画面の「要判断」に出す
  processes:                # 見張るプロセス: 名前 → python に渡す引数
    dashboard: [-m, factory, dashboard]
    feed: [-m, factory, feed]

onchain:                    # チェーン上の道具(設計書 2026-11-04 の第0期)。読み取りだけで、鍵もお金も使わない
  cache_path: data/chain_cache.db   # 確定したブロックの読み取りのキャッシュ(消しても読み直すだけ)
  rpc:
    timeout_seconds: 15
    per_minute: 300         # 1つの接続先に1分で送る回数の上限(無料の接続先の上限は公表されていないので控えめに)
    shares: {live: 0.2, paper: 0.3, research: 0.5}       # 使い道ごとに使ってよい割合(本番 > paper > 調査)
    wait_seconds: {live: 2, paper: 30, research: 120}    # どの接続先も使えない時に待つ長さ
    cooldown_rate_seconds: 60    # 断られた(429)接続先を休ませる秒数
    cooldown_error_seconds: 30   # つながらない・壊れた答えの接続先を休ませる秒数(続けば倍にしていく。上限10分)
    cooldown_quota_seconds: 1800 # 使える量を使い切った(1日・プランの上限)と言われた接続先を休ませる秒数
    skip_after_failures: 3       # 同じ読み方(古いブロックなど)をこの回数続けて断った接続先は
    skip_seconds: 600            #   ほかの接続先が答えられるなら、その読み方の時だけこの秒数外す
  watch:                    # 機会の見張り(Aave の清算)
    borrower_days: 90       # 借りた記録をさかのぼる日数(これより前に借りて、その後借りていない借り手は見えない)
    multicall_batch: 100    # 健康度を1回でまとめて読む人数
    min_debt_usd: 10        # 借金がこれ未満の口座は、清算してもガス代に負けるので機会にしない
  timing:                   # 取られるまでの速さ(liq-timing)
    max_back_blocks: 2419200  # 健康度が1を割ったブロックを、清算からさかのぼって探す最大のブロック数(約7日)
  arbs:                     # 裁定で稼いでいる主体を探す(arb-scan)
    log_blocks: 500         # 交換の記録を1回で読むブロック数(記録が多いので狭く。1回の答えが大きすぎると時間切れになる)。チェーンごとの arb_log_blocks が優先
    sample_actors: 15       # 受領書を読んで財布・ガス代・優先レーンを確かめる主体の数(粗利の多い順)
    sample_per_actor: 20    # 1主体あたり、受領書を読む裁定の数(粗利の大きい順)
  chains:
    arbitrum:
      chain_id: 42161
      block_seconds: 0.25   # 1ブロックの時間の目安
      cache_depth: 2400     # 最新からこのブロック数(約10分)より古いブロックは確定とみなしてキャッシュする
      max_log_blocks: 10000 # ログを1回で読むブロック数。接続先に広すぎると断られたら半分ずつにする
      endpoints:            # 無料の公開接続先。上から順ではなく、空いている所に回す
        - https://arb1.arbitrum.io/rpc
        - https://arbitrum-one-rpc.publicnode.com
        - https://arbitrum.drpc.org
        - https://1rpc.io/arb
        - https://arbitrum.llamarpc.com
        - https://arbitrum-one.public.blastapi.io
      protocols:
        aave_v3_pool: "0x794a61358D6845594F94dc1DB02A252b5b4814aD"   # 貸し借りの仕組み(清算の記録を出す)
        weth: "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"           # ガス代をドルにする時の ETH の値段に使う
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"     # 多くの読み取りを1回にまとめる仕組み(どのチェーンも同じ住所)
    # --- 第0期を広げるチェーン(2026-11-06。作者が名前を出しているチェーン)。住所は Aave の住所録(bgd-labs/aave-address-book)と
    #     HyperLend の資料から写した。block_seconds は目安で、道具はチェーンから実際のブロックの間隔を測って使う。
    #     arb_log_blocks は arb-scan で交換の記録を1回で読むブロック数(交換の多いチェーンほど狭く)
    optimism:
      chain_id: 10
      block_seconds: 2
      cache_depth: 300
      max_log_blocks: 10000
      arb_log_blocks: 150
      endpoints:
        - https://mainnet.optimism.io
        - https://optimism-rpc.publicnode.com
        - https://optimism.drpc.org
        - https://1rpc.io/op
      protocols:
        aave_v3_pool: "0x794a61358D6845594F94dc1DB02A252b5b4814aD"
        weth: "0x4200000000000000000000000000000000000006"           # ガス代は ETH
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
    polygon:
      chain_id: 137
      block_seconds: 2
      cache_depth: 300
      max_log_blocks: 10000
      arb_log_blocks: 100
      endpoints:                                   # polygon-rpc.com は 11/6 に止まっていた(tenant disabled)ので外した
        - https://polygon-bor-rpc.publicnode.com
        - https://polygon.drpc.org
        - https://1rpc.io/matic
      protocols:
        aave_v3_pool: "0x794a61358D6845594F94dc1DB02A252b5b4814aD"
        weth: "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270"           # ガス代は POL(WPOL の値段で読む)
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
    avalanche:
      chain_id: 43114
      block_seconds: 2
      cache_depth: 300
      max_log_blocks: 2048
      arb_log_blocks: 150
      endpoints:
        - https://api.avax.network/ext/bc/C/rpc
        - https://avalanche-c-chain-rpc.publicnode.com
        - https://avalanche.drpc.org
        - https://1rpc.io/avax/c
      protocols:
        aave_v3_pool: "0x794a61358D6845594F94dc1DB02A252b5b4814aD"
        weth: "0xB31f66AA3C1e785363F0875A1B74E27b85FD66c7"           # ガス代は AVAX(WAVAX の値段で読む)
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
      # venue-scan --known で、市場の住所を決めて読む Compound の写し(2026-11-07、docs.benqi.fi の Core Markets から写した)
      compound_comptrollers:
        Benqi: "0x486Af39519B4Dc9a7fCcd318217352830E8AD9b4"
    gnosis:
      chain_id: 100
      block_seconds: 5
      cache_depth: 120
      max_log_blocks: 10000
      arb_log_blocks: 200
      endpoints:
        - https://rpc.gnosischain.com
        - https://gnosis-rpc.publicnode.com
        - https://gnosis.drpc.org
        - https://1rpc.io/gnosis
      protocols:
        aave_v3_pool: "0xb50201558B00496A145fE76f7424749556E326D8"
        weth: "0xe91D153E0b41518A2Ce8Dd3D7944Fa863463a97d"           # ガス代は xDAI(WXDAI の値段で読む)
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
    hyperevm:
      chain_id: 999
      block_seconds: 2
      cache_depth: 300
      max_log_blocks: 1000
      arb_log_blocks: 200
      endpoints:
        - https://rpc.hyperliquid.xyz/evm
        - https://rpc.hypurrscan.io
        - https://hyperliquid.drpc.org
      protocols:
        aave_v3_pool: "0x00A89d7a5A02160f20150EbEA7a2b5E4879A1A8b"   # HyperLend(Aave v3 の写し)
        weth: "0x5555555555555555555555555555555555555555"           # ガス代は HYPE(wHYPE の値段で読む)
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
    ethereum:
      chain_id: 1
      block_seconds: 12
      cache_depth: 64
      max_log_blocks: 2000
      arb_log_blocks: 20
      endpoints:
        - https://ethereum-rpc.publicnode.com
        - https://eth.drpc.org
        - https://eth.merkle.io                    # ログは1回1,000ブロックまで(sqd.dev の調べ、2026-06)
        - https://rpc.mevblocker.io                # ログは1回1万件まで
        - https://eth.llamarpc.com
        - https://1rpc.io/eth
      protocols:
        aave_v3_pool: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
        weth: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
    bsc:
      chain_id: 56
      block_seconds: 0.45                          # 2026-11-10 の venue-scan で7日 = 1,343,402ブロック(読めない時の目安)
      cache_depth: 800
      max_log_blocks: 5000
      arb_log_blocks: 20
      endpoints:
        - https://bsc-rpc.publicnode.com
        - https://bsc-dataseed.bnbchain.org
        - https://bsc.drpc.org
        - https://1rpc.io/bnb
      protocols:
        aave_v3_pool: "0x6807dc923806fE8Fd134338EABCA509979a7e0cB"
        weth: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"           # ガス代は BNB(WBNB の値段で読む)
        multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
      # venue-scan --known で、市場の住所を決めて読む Compound の写し(2026-11-07、docs-v4.venus.io の Core Pool から写した)
      compound_comptrollers:
        Venus: "0xfD36E2c2a6789Db23113685031d7F16329158384"
